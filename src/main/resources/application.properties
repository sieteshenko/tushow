spring.application.name=enescena

# ==========================================
# Base de datos
# ==========================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:enescena}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Servidor
# ==========================================

server.port=${PORT:8080}

# ==========================================
# Encoding
# ==========================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# Fotos y videos de artistas
# ==========================================

# Carpeta donde se guardan los archivos. En Railway debe ser un volumen
# (por ejemplo MEDIA_DIR=/data/media); sin volumen se pierden en cada deploy.
app.media.dir=${MEDIA_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=120MB

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}